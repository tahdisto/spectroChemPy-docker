services:
  spectrochempy:
    build: .
    container_name: spectrochempy-jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=YOURDESIREDPASSWORD
    volumes:
      - ./notebooks:/app/notebooks
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root
    restart: unless-stopped
